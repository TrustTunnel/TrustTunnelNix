name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: nix flake check (${{ matrix.system }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            system: x86_64-linux
            command: nix flake check --print-build-logs
          - os: ubuntu-24.04-arm
            system: aarch64-linux
            command: >-
              nix flake check --no-build &&
              nix build --print-build-logs
              .#packages.aarch64-linux.trusttunnel-endpoint
              .#packages.aarch64-linux.trusttunnel-client
          - os: macos-latest
            system: aarch64-darwin
            command: nix flake check --print-build-logs
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: ${{ matrix.command }}

  format:
    name: formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix shell .#formatter.x86_64-linux -c nixfmt --check $(git ls-files '*.nix')
