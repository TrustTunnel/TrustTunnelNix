name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: nix flake check (${{ matrix.system }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            system: x86_64-linux
            command: nix flake check --print-build-logs
          - os: ubuntu-24.04-arm
            system: aarch64-linux
            command: >-
              nix flake check --no-build &&
              nix build --print-build-logs
              .#packages.aarch64-linux.trusttunnel-endpoint
              .#packages.aarch64-linux.trusttunnel-client
          - os: macos-latest
            system: aarch64-darwin
            command: nix flake check --print-build-logs
          - os: macos-15-intel
            system: x86_64-darwin
            command: nix flake check --print-build-logs
            installCommand: nix-env --quiet -j8 -iA cachix -f https://cachix.org/api/v1/install/1.11.1
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Check Cachix token
        if: github.ref == 'refs/heads/master'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "$CACHIX_AUTH_TOKEN" ]; then
            echo "::error::CACHIX_AUTH_TOKEN is not set"
            exit 1
          fi
      - name: Set up Cachix
        uses: cachix/cachix-action@v17
        with:
          name: trusttunnel
          authToken: ${{ github.ref == 'refs/heads/master' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: true
          installCommand: ${{ matrix.installCommand }}
      - run: ${{ matrix.command }}
      - name: Push packages to Cachix
        if: github.ref == 'refs/heads/master'
        continue-on-error: true
        run: nix path-info .#packages.${{ matrix.system }}.trusttunnel-endpoint .#packages.${{ matrix.system }}.trusttunnel-client | cachix push trusttunnel

  format:
    name: formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - run: nix shell .#formatter.x86_64-linux -c nixfmt --check $(git ls-files '*.nix')
